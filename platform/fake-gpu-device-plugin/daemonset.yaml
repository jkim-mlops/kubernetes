apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fake-gpu-device-plugin
  namespace: kube-system
  labels:
    app: fake-gpu-device-plugin
spec:
  selector:
    matchLabels:
      app: fake-gpu-device-plugin
  template:
    metadata:
      labels:
        app: fake-gpu-device-plugin
    spec:
      # Only the workers pretend to have GPUs, so the lab can also demonstrate
      # "no node advertises this resource" without deleting anything.
      nodeSelector:
        k8slab.io/gpu: "true"
      priorityClassName: system-node-critical
      # A device plugin must still start on a node tainted to keep ordinary
      # workloads off it — that is the whole point of a dedicated GPU node.
      tolerations:
        - operator: Exists
      containers:
        - name: plugin
          image: k8slab/fake-gpu-device-plugin:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: FAKE_GPU_COUNT
              value: "2"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
